name: Prek auto-update

on:
  schedule:
    - cron: "0 0 * * 1"

jobs:
  auto-update:
    name: Prek auto-update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checking out code from GitHub
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('**/Pipfile.lock') }}-${{ matrix.python-version }}
          restore-keys: |
            pip-

      - name: Install dependencies
        run: |
          pip install pipenv
          pipenv sync --dev

      - name: Run prek auto-update
        run: pipenv run prek auto-update

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: update/prek-auto-update
          title: Auto-update prek hooks
          commit-message: Auto-update prek hooks
          body: Update versions of tools in prek configs to latest version
          labels: dependencies
